[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frechet-edit"
version = "0.1.0"
description = "Strong Frechet edit distance, discrete and continuous, with verifiable minimal-edit witnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joash Lau" }]
keywords = ["frechet", "edit-distance", "trajectory", "curve-matching", "computational-geometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "hypothesis>=6.90", "ruff>=0.5", "mypy>=1.8", "build>=1.0", "twine>=5.0"]
experiments = ["matplotlib>=3.7", "tomli>=2.0; python_version < '3.11'"]
# The course-audit web app in webapp/ (not part of the installed package).
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
# Browser end-to-end tests for the web app; also needs Edge, Chrome, or
# `playwright install chromium`.
e2e = ["playwright>=1.44"]

[project.urls]
Homepage = "https://github.com/joass1/frechet-edit"
Documentation = "https://github.com/joass1/frechet-edit/tree/main/docs"
Source = "https://github.com/joass1/frechet-edit"
Issues = "https://github.com/joass1/frechet-edit/issues"
Changelog = "https://github.com/joass1/frechet-edit/blob/main/CHANGELOG.md"
Limitations = "https://github.com/joass1/frechet-edit/blob/main/docs/limitations.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frechet_edit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments", "webapp/tests"]
markers = [
  "slow: exhaustive oracle comparisons and large sweeps (deselect with -m 'not slow')",
  "realdata: requires a locally provisioned, licence-checked dataset; never runs in CI",
  "e2e: drives the web app in a real browser; skipped with a reason if no browser is available",
]
filterwarnings = [
  "error::RuntimeWarning",
  # starlette's TestClient warns about its own httpx dependency; not ours to fix.
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments", "webapp"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# Type checking targets 3.12 even though the package RUNS on 3.10+. NumPy's own
# stubs use PEP 695 `type` statements, which mypy can only parse when targeting
# 3.12 or later, so a 3.10 target now fails inside numpy before it reaches this
# package. Actual 3.10 support is verified where it matters, by running the test
# suite on 3.10 in CI.
python_version = "3.12"
packages = ["frechet_edit"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
